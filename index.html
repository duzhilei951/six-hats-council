<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六帽推演厅 · Six Hats Council</title>
<style>
:root {
  --bg: #07090e;
  --bg-dots: rgba(255, 255, 255, 0.035);
  --surface: #0f121d;
  --surface-card: rgba(18, 22, 36, 0.72);
  --surface-hover: rgba(28, 35, 56, 0.85);
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-sub: #64748b;
  --primary: #6366f1;
  --primary-light: #818cf8;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;

  /* 六顶帽子本色 */
  --hat-blue: #3b82f6;
  --hat-white: #cbd5e1;
  --hat-green: #22c55e;
  --hat-yellow: #eab308;
  --hat-black: #6b7280;
  --hat-red: #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 50% -10%, rgba(99, 102, 241, 0.16) 0%, transparent 55%),
    radial-gradient(circle at 12% 30%, rgba(34, 197, 94, 0.06) 0%, transparent 45%),
    radial-gradient(circle at 88% 40%, rgba(239, 68, 68, 0.05) 0%, transparent 45%),
    radial-gradient(var(--bg-dots) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px;
  background-attachment: fixed;
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}

.container { max-width: 1080px; margin: 0 auto; padding: 0 20px 100px; }

/* ===== 顶部导航 ===== */
.navbar {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  background: rgba(7, 9, 14, 0.84);
  border-bottom: 1px solid var(--border);
  padding: 12px 28px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 38px; height: 38px; border-radius: 11px;
  background: conic-gradient(from 210deg, #3b82f6, #22c55e, #eab308, #ef4444, #6b7280, #cbd5e1, #3b82f6);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; border: 1px solid rgba(255,255,255,0.28);
  box-shadow: 0 0 22px rgba(99,102,241,0.4);
}
.brand-title {
  font-size: 18px; font-weight: 800; letter-spacing: -0.03em;
  background: linear-gradient(to right, #ffffff 35%, #c7d2fe 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand-sub { font-size: 11px; color: var(--text-sub); letter-spacing: 0.04em; }
.env-badge {
  font-size: 12px; padding: 5px 12px; border-radius: 999px;
  background: rgba(99,102,241,0.12); color: var(--primary-light);
  border: 1px solid rgba(99,102,241,0.3); white-space: nowrap;
}

/* ===== 卡片 ===== */
.card {
  background: var(--surface-card); backdrop-filter: blur(14px);
  border: 1px solid var(--border); border-radius: 16px;
  padding: 22px; margin-bottom: 18px;
  box-shadow: 0 10px 34px rgba(0,0,0,0.22);
}
.card-title {
  font-size: 15px; font-weight: 700; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}

/* ===== 输入区 ===== */
.label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; display: block; }
textarea {
  width: 100%; background: rgba(0,0,0,0.28);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 14px; color: var(--text-main); font-size: 14px;
  font-family: inherit; resize: vertical; outline: none; min-height: 88px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.13); }
textarea::placeholder { color: var(--text-sub); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
.chip {
  font-size: 12px; padding: 6px 13px; border-radius: 999px; cursor: pointer;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  color: var(--text-muted); transition: all 0.18s;
}
.chip:hover { background: rgba(99,102,241,0.16); color: #c7d2fe; border-color: rgba(129,140,248,0.45); transform: translateY(-1px); }

/* ===== 按钮 ===== */
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
button {
  background: var(--primary); color: #fff; border: none;
  border-radius: 11px; padding: 11px 22px; font-size: 14px; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  font-family: inherit; transition: all 0.2s;
}
button:hover:not(:disabled) { background: #4f46e5; box-shadow: 0 0 18px rgba(99,102,241,0.42); transform: translateY(-1px); }
button:disabled { opacity: 0.42; cursor: not-allowed; }
.btn-ghost { background: rgba(255,255,255,0.06); color: var(--text-main); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.12); box-shadow: none; }
.btn-danger { background: rgba(239,68,68,0.85); }
.btn-danger:hover:not(:disabled) { background: var(--danger); box-shadow: 0 0 18px rgba(239,68,68,0.4); }
.btn-sm { padding: 7px 14px; font-size: 12.5px; border-radius: 9px; }

/* ===== 帽子进度灯 ===== */
.pipeline { display: none; margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--border); }
.pipeline.show { display: block; }
.pipe-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.pipe-status { font-size: 13px; color: var(--text-muted); }
.timer {
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 13px; font-weight: 700; color: var(--warning);
  background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25);
  padding: 3px 11px; border-radius: 999px;
}

.hat-lamp-row { display: flex; gap: 8px; }
.hat-lamp {
  flex: 1; min-width: 0; border-radius: 11px; padding: 11px 6px;
  text-align: center; background: rgba(255,255,255,0.035);
  border: 1px solid var(--border); transition: all 0.32s cubic-bezier(0.16,1,0.3,1);
  position: relative; overflow: hidden;
}
.hat-lamp .hl-icon { font-size: 19px; line-height: 1.2; display: block; filter: grayscale(1); opacity: 0.42; transition: all 0.3s; }
.hat-lamp .hl-name { font-size: 11px; color: var(--text-sub); margin-top: 3px; font-weight: 600; transition: color 0.3s; }

.hat-lamp.active { background: rgba(255,255,255,0.07); border-color: var(--hat-color); box-shadow: 0 0 20px -3px var(--hat-color); transform: translateY(-3px) scale(1.03); }
.hat-lamp.active .hl-icon { filter: none; opacity: 1; transform: scale(1.16); }
.hat-lamp.active .hl-name { color: var(--hat-color); }

.hat-lamp.done { border-color: rgba(255,255,255,0.13); background: rgba(255,255,255,0.05); }
.hat-lamp.done .hl-icon { filter: none; opacity: 0.78; }
.hat-lamp.done .hl-name { color: var(--text-muted); }
.hat-lamp.done::after {
  content: "✓"; position: absolute; top: 4px; right: 6px;
  font-size: 10px; color: var(--success); font-weight: 700;
}
.hat-lamp.skipped { opacity: 0.3; }

/* ===== 结果卡片 ===== */
.results { margin-top: 22px; }
.hat-card {
  border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
  background: rgba(255,255,255,0.028);
  border: 1px solid var(--border); border-left: 3px solid var(--hat-color);
  animation: slideUp 0.42s cubic-bezier(0.16,1,0.3,1);
}
@keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.hat-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.hat-card-icon { font-size: 19px; }
.hat-card-name { font-size: 14.5px; font-weight: 700; color: var(--hat-color); }
.hat-card-role { font-size: 11.5px; color: var(--text-sub); }
.hat-card-body { font-size: 13.8px; color: #dbe2ef; }
.hat-card-body p { margin-bottom: 9px; }
.hat-card-body p:last-child { margin-bottom: 0; }
.hat-card-body strong { color: #fff; font-weight: 700; }
.hat-card-body h4 { font-size: 13.5px; color: var(--hat-color); margin: 13px 0 7px; font-weight: 700; }
.hat-card-body h4:first-child { margin-top: 0; }
.hat-card-body ul, .hat-card-body ol { margin: 7px 0 10px 20px; }
.hat-card-body li { margin-bottom: 5px; }
.hat-card-body code {
  font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
  background: rgba(0,0,0,0.42); padding: 1.5px 6px; border-radius: 5px; color: #a5b4fc;
}
.hat-card-body hr { border: none; border-top: 1px solid var(--border); margin: 13px 0; }

/* 正在流式输出的卡片 */
.hat-card.streaming { box-shadow: 0 0 0 1px var(--hat-color), 0 0 26px -8px var(--hat-color); }
.cursor-blink {
  display: inline-block; width: 7px; height: 15px; vertical-align: -2px;
  background: var(--hat-color); margin-left: 3px; animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* 蓝帽合成卡（重点强调） */
.hat-card.is-synthesis {
  background: linear-gradient(150deg, rgba(59,130,246,0.13), rgba(99,102,241,0.05));
  border: 1px solid rgba(59,130,246,0.34); border-left: 3px solid var(--hat-blue);
}

/* ===== 空状态与加载 ===== */
.empty {
  text-align: center; padding: 46px 20px; color: var(--text-sub); font-size: 13.5px;
}
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }

.spinner {
  width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.22);
  border-top-color: #fff; border-radius: 50%; animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 历史记录 ===== */
.history-item {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: 10px; cursor: pointer;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  margin-bottom: 8px; transition: all 0.18s;
}
.history-item:hover { background: rgba(99,102,241,0.11); border-color: rgba(129,140,248,0.35); }
.history-topic { font-size: 13.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.history-time { font-size: 11px; color: var(--text-sub); white-space: nowrap; }

.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: rgba(18,22,36,0.97); border: 1px solid var(--border-strong);
  color: var(--text-main); padding: 11px 22px; border-radius: 11px; font-size: 13.5px;
  z-index: 999; opacity: 0; transition: all 0.32s cubic-bezier(0.16,1,0.3,1);
  backdrop-filter: blur(14px); box-shadow: 0 12px 34px rgba(0,0,0,0.5);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.section-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 30px 0 18px; color: var(--text-sub); font-size: 12px;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.section-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

@media (max-width: 720px) {
  .hat-lamp .hl-name { font-size: 9.5px; }
  .hat-lamp .hl-icon { font-size: 16px; }
  .navbar { padding: 10px 16px; }
  .container { padding: 0 14px 80px; }
}

/* ===== Markdown 增强：多级标题 / 表格 / 引用 / 链接 / 删除线 / 任务清单 ===== */
.hat-card-body h1 { font-size: 15px; color: var(--hat-color, #fff); margin: 14px 0 7px; font-weight: 700; }
.hat-card-body h2 { font-size: 14.5px; color: var(--hat-color, #fff); margin: 13px 0 7px; font-weight: 700; }
.hat-card-body h3 { font-size: 14px; color: var(--hat-color, #fff); margin: 13px 0 7px; font-weight: 700; }
.hat-card-body h1:first-child, .hat-card-body h2:first-child,
.hat-card-body h3:first-child, .hat-card-body h4:first-child { margin-top: 0; }

.hat-card-body ul ul, .hat-card-body ol ol,
.hat-card-body ul ol, .hat-card-body ol ul { margin: 4px 0 4px 16px; }

.hat-card-body blockquote {
  margin: 9px 0; padding: 7px 13px;
  border-left: 3px solid var(--hat-color, #6366f1);
  background: rgba(255,255,255,0.04);
  border-radius: 0 8px 8px 0;
  color: var(--text-sub); font-style: italic;
}

.hat-card-body pre {
  background: rgba(0,0,0,0.45); border: 1px solid var(--border);
  border-radius: 9px; padding: 11px 13px; overflow-x: auto; margin: 10px 0;
}
.hat-card-body pre code {
  background: none; border: none; padding: 0; color: #cbd5e1;
  font-size: 12.5px; line-height: 1.6;
}

.md-table-wrap {
  overflow-x: auto; margin: 11px 0; border-radius: 9px;
  border: 1px solid var(--border); background: rgba(0,0,0,0.22);
}
.md-table { width: 100%; border-collapse: collapse; font-size: 12.6px; text-align: left; }
.md-table th {
  background: rgba(255,255,255,0.05); padding: 8px 12px;
  border-bottom: 1px solid var(--border-strong); color: var(--hat-color, #a5b4fc);
  font-weight: 700; white-space: nowrap;
}
.md-table td {
  padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
  color: var(--text-main); line-height: 1.6; vertical-align: top;
}
.md-table tr:last-child td { border-bottom: none; }
.md-table tbody tr:hover td { background: rgba(99,102,241,0.08); }

.md-link { color: #67e8f9; text-decoration: none; border-bottom: 1px dashed rgba(103,232,249,0.5); }
.md-link:hover { color: #a5f3fc; border-bottom-color: #a5f3fc; }
.md-del { color: var(--text-sub); text-decoration: line-through; }
.md-check { color: var(--success); font-weight: 700; margin-right: 4px; }

/* =====================================================================
   穿透追问 · 深度研讨室
   ===================================================================== */
.inquiry-section {
  margin-top: 26px; border-radius: 15px; overflow: hidden;
  background: var(--bg-card); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-card);
}
.inquiry-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  flex-wrap: wrap; padding: 14px 18px;
  border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02);
}
.inquiry-title { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 700; }
.inquiry-title .dot-live {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success); box-shadow: 0 0 8px var(--success);
}
.inquiry-tag {
  font-size: 11px; padding: 2px 8px; border-radius: 5px; font-weight: 400;
  background: rgba(99,102,241,0.16); color: #a5b4fc; border: 1px solid rgba(129,140,248,0.35);
}
.inquiry-body { padding: 18px; }

.inquiry-chat {
  display: flex; flex-direction: column; gap: 14px;
  max-height: 460px; overflow-y: auto; padding-right: 6px; margin-bottom: 16px;
}
.inquiry-chat::-webkit-scrollbar { width: 5px; }
.inquiry-chat::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

.inquiry-msg { display: flex; flex-direction: column; gap: 6px; }
.inquiry-msg.user { align-self: flex-end; max-width: 86%; }
.inquiry-msg.assistant { align-self: flex-start; width: 100%; }
.inquiry-bubble {
  padding: 12px 16px; border-radius: 11px;
  font-size: 13.6px; line-height: 1.7;
}
.inquiry-msg.user .inquiry-bubble {
  background: rgba(99,102,241,0.17); border: 1px solid rgba(129,140,248,0.4);
  color: var(--text-main); border-top-right-radius: 2px;
}
.inquiry-msg.assistant .inquiry-bubble {
  background: rgba(0,0,0,0.26); border: 1px solid var(--border);
  border-top-left-radius: 2px;
}
.inquiry-who { font-size: 11.5px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }

.inquiry-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 13px; }
.inquiry-chip {
  font-size: 12px; padding: 5px 12px; border-radius: 20px; cursor: pointer;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  color: var(--text-sub); user-select: none; transition: all 0.18s;
}
.inquiry-chip:hover {
  background: rgba(99,102,241,0.14); border-color: rgba(129,140,248,0.45);
  color: #c7d2fe; transform: translateY(-1px);
}

.inquiry-input-row {
  display: flex; gap: 10px; padding: 8px 12px; border-radius: 11px;
  background: rgba(0,0,0,0.28); border: 1px solid var(--border);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.inquiry-input-row:focus-within {
  border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99,102,241,0.16);
}
#inquiryInput {
  flex: 1; background: transparent; border: none; outline: none; resize: none;
  color: var(--text-main); font-family: inherit; font-size: 13.6px; line-height: 1.5;
  min-height: 44px; max-height: 150px; padding: 11px 0; box-sizing: border-box;
}
#inquiryInput::placeholder { color: var(--text-sub); opacity: 0.8; }
#inquirySend {
  align-self: flex-end; flex-shrink: 0; white-space: nowrap;
  padding: 11px 22px; border: none; border-radius: 11px; cursor: pointer;
  font-size: 13.6px; font-weight: 700; letter-spacing: 0.04em; color: #fff;
  background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
  box-shadow: 0 4px 16px rgba(99,102,241,0.42);
  display: flex; align-items: center; gap: 6px; transition: all 0.2s;
}
#inquirySend:hover:not(:disabled) { transform: translateY(-1px) scale(1.03); box-shadow: 0 7px 22px rgba(99,102,241,0.6); }
#inquirySend:active:not(:disabled) { transform: scale(0.96); }
#inquirySend:disabled { opacity: 0.55; cursor: not-allowed; filter: grayscale(0.35); box-shadow: none; transform: none; }

.inquiry-hint { margin-top: 8px; font-size: 11.5px; color: var(--text-sub); text-align: right; user-select: none; }
.inquiry-hint kbd {
  display: inline-block; padding: 1px 6px; margin: 0 2px; border-radius: 4px;
  font-family: ui-monospace, Consolas, monospace; font-size: 10.5px;
  color: #a5b4fc; background: rgba(99,102,241,0.16); border: 1px solid rgba(129,140,248,0.32);
}
.inquiry-empty { text-align: center; color: var(--text-sub); font-size: 12.5px; padding: 18px 0; }
.inquiry-typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.inquiry-typing i {
  width: 5px; height: 5px; border-radius: 50%; background: #818cf8;
  animation: inqType 1.2s infinite ease-in-out;
}
.inquiry-typing i:nth-child(2) { animation-delay: 0.2s; }
.inquiry-typing i:nth-child(3) { animation-delay: 0.4s; }
@keyframes inqType {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1.1); opacity: 1; }
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="brand">
    <div class="brand-icon">🎩</div>
    <div>
      <div class="brand-title">六帽推演厅</div>
      <div class="brand-sub">SIX HATS COUNCIL · 平行思考引擎</div>
    </div>
  </div>
  <div id="envBadge" class="env-badge">检测环境中…</div>
</nav>

<div class="container">

  <!-- 输入区 -->
  <div class="card">
    <div class="card-title">🎯 待审议议题</div>
    <label class="label">把你的决策难题交给六顶帽子，它们会依次从六个角度把它看透</label>
    <textarea id="topicInput" placeholder="例：我们公司要不要把核心业务系统迁移到私有化部署的大模型上？"></textarea>

    <div class="chips" id="templateChips"></div>

    <div class="btn-row">
      <button id="runBtn">
        <span id="runBtnText">开始六帽推演</span>
      </button>
      <button id="cancelBtn" class="btn-danger" style="display:none;">终止推演</button>
    </div>

    <!-- 帽子进度灯 + 计时 -->
    <div class="pipeline" id="pipeline">
      <div class="pipe-head">
        <span class="pipe-status" id="pipeStatus">准备中…</span>
        <span class="timer" id="timer">0.0s</span>
      </div>
      <div class="hat-lamp-row" id="hatLamps"></div>
    </div>
  </div>

  <!-- 结果区 -->
  <div class="results" id="results"></div>

  <!-- 穿透追问 · 深度研讨室 -->
  <div class="inquiry-section" id="inquirySection" style="display:none;">
    <div class="inquiry-head">
      <div class="inquiry-title">
        <span class="dot-live"></span>
        <span>💬 穿透追问 · 深度研讨室</span>
        <span class="inquiry-tag">已锚定本场六帽推演</span>
      </div>

<script>
/* ============================================================

   架构要点：串行推进（规避 Cherry 并发上限 2）+ 双轨环境感知
            + 自愈式 JSON 解析 + 防焦虑流水线
   ============================================================ */

/* ---------- 1. 环境检测（双轨防御） ---------- */
const isCherry = typeof window !== 'undefined' && typeof window.cherry !== 'undefined' && window.cherry !== null;

/* ---------- 2. 六顶帽子知识底座 ---------- */
const HATS = {
  blue:  { name: '蓝帽', en: 'Blue',   icon: '🧭', role: '流程控制与收束', color: 'var(--hat-blue)',   colorRaw: '#3b82f6',
           directive: '你只负责组织思考流程、把控节奏、最后收束结论。你不贡献观点，只做调度与综合。' },
  white: { name: '白帽', en: 'White',  icon: '⚪', role: '中立的事实与数据', color: 'var(--hat-white)', colorRaw: '#cbd5e1',
           directive: '你只能陈述客观事实、数据、已验证的信息。严禁评价、严禁推测、严禁表达喜好。必须区分「已知事实」与「信息缺口」。' },
  green: { name: '绿帽', en: 'Green',  icon: '🟢', role: '创意与可能性', color: 'var(--hat-green)', colorRaw: '#22c55e',
           directive: '你只负责生产新点子、替代方案、反向做法、疯狂假设。严禁批评、严禁泼冷水、严禁说「这不可行」。' },
  yellow:{ name: '黄帽', en: 'Yellow', icon: '🟡', role: '价值与机会', color: 'var(--hat-yellow)', colorRaw: '#eab308',

  black: { name: '黑帽', en: 'Black',  icon: '⚫', role: '风险与批判', color: 'var(--hat-black)',  colorRaw: '#6b7280',
           directive: '你只负责指出风险、隐患、失败路径、为什么行不通。必须具体到「什么情况下会怎么崩」，严禁泛泛而谈。' },
  red:   { name: '红帽', en: 'Red',    icon: '🔴', role: '情感与直觉', color: 'var(--hat-red)',    colorRaw: '#ef4444',
           directive: '你只表达直觉、预感、情绪反应。严禁给出任何理由和论证——「我就是觉得不对劲」才是合格的回答。' }
};

/* 标准推进序（蓝帽开场 → 五帽 → 蓝帽收尾），可被蓝帽开局动态裁剪 */
const DEFAULT_ORDER = ['white', 'green', 'yellow', 'black', 'red'];

/* ---------- 3. 存储适配层 ---------- */
const store = {
  async get(key) {
    try {
      if (isCherry && window.cherry.storage) {
        const r = await window.cherry.storage.get(key);
        return r && r.value ? JSON.parse(r.value) : null;
      }
      const v = localStorage.getItem('shc_' + key);
      return v ? JSON.parse(v) : null;
    } catch (e) { console.warn('storage.get 失败', e); return null; }
  },
  async set(key, val) {
    try {
      const s = JSON.stringify(val);
      if (isCherry && window.cherry.storage) { await window.cherry.storage.set(key, s); return; }
      localStorage.setItem('shc_' + key, s);
    } catch (e) { console.warn('storage.set 失败', e); }
  }
};

/* ---------- 4. 自愈式松散 JSON 解析器 ---------- */
function safeParseJSON(raw, fallback) {
  if (!raw) return fallback;
  try { return JSON.parse(raw); } catch (e) { /* 进入自愈流程 */ }
  const m = String(raw).match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
  if (m) {
    let c = m[0];
    c = c.replace(/```json/gi, '').replace(/```/g, '');
    c = c.replace(/,\s*([\]}])/g, '$1');       // 去尾逗号
    c = c.replace(/([{,]\s*)([A-Za-z_][\w]*)\s*:/g, '$1"$2":'); // 补裸键引号
    try { return JSON.parse(c); } catch (e2) { console.warn('二级自愈仍失败', e2, c.slice(0, 200)); }
  }
  return fallback;
}

/* ---------- 5. 完整版 Markdown 渲染引擎 ----------
   支持：代码块 / 表格 / 1~6 级标题 / 分隔线 / 引用 / 有序无序及嵌套列表 /
        任务清单 / 加粗斜体删除线 / 行内代码 / 超链接
   架构：哨兵占位符保护代码 → 行级状态机解析块级 → 还原代码块
   ------------------------------------------------------------ */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* 哨兵字符取自 Unicode 私有使用区，正常文本几乎不可能出现，
   用 fromCharCode 构造可彻底避免源码里写入不可见控制字符。 */
var MD_SENT = String.fromCharCode(0xE000);
var MD_SENT_RE = new RegExp(MD_SENT + '(\\d+)' + MD_SENT, 'g');

/* 行内元素渲染（入参必须已 HTML 转义） */
function renderInline(escapedText) {
  if (escapedText === null || escapedText === undefined) return '';
  var s = String(escapedText);
  var codes = [];

  // 先用哨兵保护行内代码，防止其中的 * _ 被误判为强调符号
  s = s.replace(/`([^`]+)`/g, function (m, c) {
    codes.push(c);
    return MD_SENT + (codes.length - 1) + MD_SENT;
  });

  // 超链接 [文本](地址)
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    '<a class="md-link" href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  // 加粗
  s = s.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([\s\S]+?)__/g, '<strong>$1</strong>');

  // 删除线
  s = s.replace(/~~([\s\S]+?)~~/g, '<del class="md-del">$1</del>');

  // 斜体（避免误伤 ** 与 snake_case）
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^_\w])_([^_\n]+)_/g, '$1<em>$2</em>');

  // 还原行内代码
  s = s.replace(MD_SENT_RE, function (m, n) {
    return '<code>' + (codes[Number(n)] || '') + '</code>';
  });
  return s;
}

/* 拆分表格行：去掉首尾竖线后按 | 切分 */
function splitTableRow(row) {
  return row.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|');
}

function renderMD(text) {
  if (text === null || text === undefined || text === '') return '';
  var src = String(text).replace(/\r\n?/g, '\n');
  if (!src.trim()) return '';

  /* ---- 1) 抽出围栏代码块，用哨兵占位，避免逐行解析破坏其内容 ---- */
  var codeStore = [];
  function stash(html) {
    codeStore.push(html);
    return MD_SENT + (codeStore.length - 1) + MD_SENT;
  }
  // 已闭合的代码块
  src = src.replace(/```[ \t]*[a-zA-Z0-9#+\-]*[ \t]*\n([\s\S]*?)```/g, function (m, code) {
    return stash('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
  });
  // 流式输出中尚未闭合的代码块
  src = src.replace(/```[ \t]*[a-zA-Z0-9#+\-]*[ \t]*\n?([\s\S]*)$/, function (m, code) {
    return stash('<pre><code>' + esc(code) + '</code></pre>');
  });

  var lines = src.split('\n');
  var out = [];
  var listStack = [];   // 列表层级栈 [{type:'ul'|'ol', indent:N}]
  var i = 0;

  // 惰性闭合：<li> 保持打开，直到同级下一项或退出层级时才补 </li>，
  // 使嵌套子列表正确落在父 <li> 内部，生成合法 HTML。
  function closeAllLists() {
    while (listStack.length) {
      out.push('</li>');
      out.push(listStack.pop().type === 'ol' ? '</ol>' : '</ul>');
    }
  }

  while (i < lines.length) {
    var rawLine = lines[i];
    var line = rawLine.replace(/\s+$/, '');
    var trimmed = line.trim();

    // 空行
    if (!trimmed) { closeAllLists(); i++; continue; }

    // 代码块占位符
    if (new RegExp('^' + MD_SENT + '\\d+' + MD_SENT + '$').test(trimmed)) {
      closeAllLists(); out.push(trimmed); i++; continue;
    }

    // 分隔线 --- *** ___
    if (/^([-*_])\s*\1\s*\1[\s\-*_]*$/.test(trimmed)) {
      closeAllLists(); out.push('<hr>'); i++; continue;
    }

    // 标题 # ~ ######
    var hMatch = trimmed.match(/^(#{1,6})\s+(.*?)\s*#*$/);
    if (hMatch) {
      closeAllLists();
      var lv = hMatch[1].length;
      var tag = lv >= 4 ? 'h4' : ('h' + lv);   // h5/h6 视觉上收敛到 h4 层级
      out.push('<' + tag + '>' + renderInline(esc(hMatch[2])) + '</' + tag + '>');
      i++; continue;
    }

    // 表格：当前行含 |，且下一行是分隔行
    if (trimmed.indexOf('|') !== -1 && (i + 1) < lines.length &&
        /^\s*\|?[\s:|\-]+\|[\s:|\-]*$/.test(lines[i + 1]) && /\-/.test(lines[i + 1])) {
      closeAllLists();
      var headers = splitTableRow(trimmed);
      var aligns = splitTableRow(lines[i + 1]).map(function (c) {
        var t = c.trim();
        var left = t.charAt(0) === ':';
        var right = t.charAt(t.length - 1) === ':';
        return (left && right) ? 'center' : (right ? 'right' : (left ? 'left' : ''));
      });
      i += 2;
      var bodyRows = [];
      while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') !== -1) {
        bodyRows.push(splitTableRow(lines[i].trim()));
        i++;
      }
      var tbl = '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
      headers.forEach(function (c, ci) {
        tbl += '<th' + (aligns[ci] ? ' style="text-align:' + aligns[ci] + '"' : '') + '>' +
               renderInline(esc(c.trim())) + '</th>';
      });
      tbl += '</tr></thead><tbody>';
      bodyRows.forEach(function (r) {
        tbl += '<tr>';
        for (var ci = 0; ci < headers.length; ci++) {
          tbl += '<td' + (aligns[ci] ? ' style="text-align:' + aligns[ci] + '"' : '') + '>' +
                 renderInline(esc((r[ci] || '').trim())) + '</td>';
        }
        tbl += '</tr>';
      });
      tbl += '</tbody></table></div>';
      out.push(tbl);
      continue;
    }

    // 引用块 > （连续多行合并为同一引用块）
    if (/^>\s?/.test(trimmed)) {
      closeAllLists();
      var quoted = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        quoted.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      out.push('<blockquote>' +
               renderInline(esc(quoted.join('\n'))).replace(/\n/g, '<br>') +
               '</blockquote>');
      continue;
    }

    // 列表（支持缩进嵌套、有序无序混排、任务清单）
    var liMatch = rawLine.match(/^(\s*)([-+*]|\d+[.)])\s+(.*)$/);
    if (liMatch) {
      var indent = liMatch[1].replace(/\t/g, '    ').length;
      var type = /^\d/.test(liMatch[2]) ? 'ol' : 'ul';

      while (listStack.length && listStack[listStack.length - 1].indent > indent) {
        out.push('</li>');
        out.push(listStack.pop().type === 'ol' ? '</ol>' : '</ul>');
      }
      if (listStack.length && listStack[listStack.length - 1].indent === indent &&
          listStack[listStack.length - 1].type !== type) {
        out.push('</li>');
        out.push(listStack.pop().type === 'ol' ? '</ol>' : '</ul>');
      }
      if (listStack.length && listStack[listStack.length - 1].indent === indent) {
        out.push('</li>');
      }
      if (!listStack.length || listStack[listStack.length - 1].indent < indent) {
        listStack.push({ type: type, indent: indent });
        out.push(type === 'ol' ? '<ol>' : '<ul>');
      }

      var content = liMatch[3];
      var checkbox = '';
      var cbMatch = content.match(/^\[([ xX])\]\s*(.*)$/);
      if (cbMatch) {
        checkbox = '<span class="md-check">' + (/[xX]/.test(cbMatch[1]) ? '☑' : '☐') + '</span> ';
        content = cbMatch[2];
      }
      out.push('<li>' + checkbox + renderInline(esc(content)));
      i++; continue;
    }

    // 普通段落
    closeAllLists();
    out.push('<p>' + renderInline(esc(line)) + '</p>');
    i++;
  }

  closeAllLists();

  /* ---- 2) 还原代码块 ---- */
  return out.join('').replace(MD_SENT_RE, function (m, n) {
    return codeStore[Number(n)] || '';
  });
}

let timerId = null, t0 = 0;
function startTimer() {

function buildLamps(activeOrder) {
  const row = document.getElementById('hatLamps');
  row.innerHTML = '';
  const seq = ['blue'].concat(activeOrder).concat(['blue']);
  const seen = {};
  seq.forEach(function (k, i) {
    if (k === 'blue') {
      const isOpening = i === 0;
      const key = isOpening ? 'blue-open' : 'blue-close';
      const el = document.createElement('div');
      el.className = 'hat-lamp';
      el.id = 'lamp-' + key;
      el.style.setProperty('--hat-color', HATS.blue.colorRaw);
      el.innerHTML = '<span class="hl-icon">' + HATS.blue.icon + '</span>' +
                     '<div class="hl-name">' + (isOpening ? '蓝帽·开局' : '蓝帽·收束') + '</div>';
      row.appendChild(el);
      return;
    }
    if (seen[k]) return;
    seen[k] = 1;
    const h = HATS[k];
    const el = document.createElement('div');
    el.className = 'hat-lamp';
    el.id = 'lamp-' + k;
    el.style.setProperty('--hat-color', h.colorRaw);
    el.innerHTML = '<span class="hl-icon">' + h.icon + '</span><div class="hl-name">' + h.name + '</div>';
    row.appendChild(el);
  });
}

function lampState(id, state) {
  const el = document.getElementById('lamp-' + id);
  if (!el) return;
  el.classList.remove('active', 'done');

}

/* ---------- 9. 核心：单次 AI 调用（流式） ---------- */
async function callAI(systemPrompt, userPrompt, callId, onDelta, runToken) {
  if (!isCherry || !window.cherry.ai) {
    // 浏览器仿真轨：逐字吐字，便于本地预览
    const fake = '[离线仿真轨] ' + userPrompt.slice(0, 40) + ' …（此内容为本地模拟，需在 Cherry Studio 中运行才能获得真实推演）';
    let acc = '';
    for (let i = 0; i < fake.length; i++) {
      if (runToken !== RUN_TOKEN) throw new Error('CANCELLED');
      acc += fake[i];
      onDelta(acc);
      await new Promise(function (r) { setTimeout(r, 8); });
    }
    return acc;
  }

  const caps = await window.cherry.ai.getCapabilities({ model: 'default' });
  if (!caps || caps.available === false) {
    throw new Error('NO_MODEL');
  }

  let acc = '';
  try {
    await window.cherry.ai.chat(
      { messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ],
        model: 'default' },
      { onChunk: function (t) { acc += t; onDelta(acc); }, callId: callId }
    );
  } catch (e) {
    if (e && e.name === 'Cancelled') throw new Error('CANCELLED');
    if (e && e.name === 'PermissionDenied') throw new Error('权限不足：请确认已授权 ai.chat');
    if (e && e.name === 'RateLimited') throw new Error('调用过于频繁，请稍候重试');
    if (e && e.name === 'Unavailable') throw new Error('模型暂不可用，请检查 Cherry 中的模型配置');
    throw new Error((e && e.message) || '调用失败');
  }
  return acc;
}

/* ---------- 9b. 多轮对话调用（供「穿透追问 · 深度研讨室」使用） ---------- */

  try {
    await window.cherry.ai.chat(
      { messages: messages, model: 'default' },
      { onChunk: function (t) { acc += t; onDelta(acc); }, callId: 'inquiry' }
    );
  } catch (e) {
    if (e && e.name === 'Cancelled') throw new Error('CANCELLED');
    if (e && e.name === 'PermissionDenied') throw new Error('权限不足：请确认已授权 ai.chat');
    if (e && e.name === 'RateLimited') throw new Error('调用过于频繁，请稍候重试');
    if (e && e.name === 'Unavailable') throw new Error('模型暂不可用，请检查 Cherry 中的模型配置');
    throw new Error((e && e.message) || '调用失败');
  }
  return acc;
}

/* ---------- 10. 蓝帽·开局：动态规划审议流程 ---------- */
async function blueHatPlan(topic, runToken) {
  const card = createHatCard('blue', { id: 'blue-open', title: '蓝帽 · 开局规划', role: '判定议题性质，编排审议流程' });
  setCardBody(card, '<p style="color:var(--text-sub)">正在分析议题性质…</p>', true);

  const sys = '你是六顶思考帽方法中的【蓝帽】，担任本次审议的主持人与流程设计师。\n' +
    '你的职责不是回答议题，而是设计「该怎么审议这个议题」。\n' +
    '可用帽子（蓝帽固定开启，不需你列出）：\n' +
    '  white=白帽(事实数据) / green=绿帽(创意可能) / yellow=黄帽(价值机会) / black=黑帽(风险批判) / red=红帽(情感直觉)\n\n' +
    '请分析议题性质，然后决定：\n' +
    '1. 需要启用哪几顶帽子、按什么顺序（顺序即审议节奏，通常先事实、再创意、再看价值与风险、最后直觉）\n' +
    '2. 每顶帽子针对「本议题」的具体切入点（必须具体到这个议题，不要写通用套话）\n' +
    '3. 用一句话点破议题的本质矛盾\n\n' +
    '严格只输出以下 JSON，不要任何解释、不要 Markdown 代码块标记：\n' +
    '{"essence":"议题本质的一句话","plan":[{"hat":"white","focus":"本议题下白帽应聚焦的具体问题"},{"hat":"green","focus":"..."}]}';

  let raw = '';
  try {
    raw = await callAI(sys, '待审议议题：' + topic, 'blue-plan', function (t) { raw = t; }, runToken);
  } catch (e) {
    if (e.message === 'CANCELLED') throw e;
    // 规划失败不阻断主流程，退化为默认序
    setCardBody(card, '<p>⚠️ 流程规划未能完成（' + esc(e.message) + '），已退化为标准六帽顺序推进。</p>', false);
    return { essence: '', plan: DEFAULT_ORDER.map(function (k) { return { hat: k, focus: '' }; }) };
  }

  const parsed = safeParseJSON(raw, null);
  let plan = (parsed && Array.isArray(parsed.plan)) ? parsed.plan : null;
  const essence = (parsed && parsed.essence) ? parsed.essence : '';

  // 校验与清洗：只保留合法帽子、去重、兜底默认序
  if (plan) {
    const seen = {};
    plan = plan.filter(function (p) {
      if (!p || !HATS[p.hat] || p.hat === 'blue' || seen[p.hat]) return false;
      seen[p.hat] = 1; return true;
    });
  }
  if (!plan || !plan.length) {
    plan = DEFAULT_ORDER.map(function (k) { return { hat: k, focus: '' }; });
  }

  let html = '';
  if (essence) html += '<p><strong>议题本质：</strong>' + esc(essence) + '</p>';
  html += '<h4>审议编排（' + plan.length + ' 顶帽子）</h4><ul>';
  plan.forEach(function (p, i) {
    const h = HATS[p.hat];
    html += '<li><strong style="color:' + h.colorRaw + '">' + (i + 1) + '. ' + h.name + '</strong>' +
            (p.focus ? '：' + esc(p.focus) : '') + '</li>';
  });
  html += '</ul>';
  setCardBody(card, html, false);
  return { essence: essence, plan: plan };
}

/* ---------- 11. 单顶帽子推演 ---------- */
async function runOneHat(hatKey, focus, topic, contextText, runToken) {
  const h = HATS[hatKey];
  lampState(hatKey, 'active');
  document.getElementById('pipeStatus').textContent = '正在戴 ' + h.name + ' · ' + h.role + ' …';

  const card = createHatCard(hatKey, {});
  setCardBody(card, '<p style="color:var(--text-sub)">思考中…</p>', true);

  const sys = '你是六顶思考帽方法中的【' + h.name + '】（' + h.role + '）。\n' +
    '行为铁律：' + h.directive + '\n\n' +
    '输出要求：\n' +
    '- 用中文，Markdown 格式，控制在 250 字以内，宁精勿多\n' +
    '- 用 `- ` 列要点，不要写开场白和总结寒暄\n' +
    '- 不要重复前面帽子已经说过的内容，要有增量\n' +
    '- 不要使用「作为' + h.name + '」这类自我指涉，直接给内容';

  const user = '【待审议议题】\n' + topic + '\n\n' +
    (focus ? '【蓝帽为你指定的切入点】\n' + focus + '\n\n' : '') +
    (contextText ? '【前面各顶帽子已有的产出（请勿重复，只做增量）】\n' + contextText : '（你是第一顶开讲的帽子）');

  let acc = '';
  const out = await callAI(sys, user, 'hat-' + hatKey, function (t) {
    acc = t; setCardBody(card, renderMD(t), true);
  }, runToken);

  setCardBody(card, renderMD(out), false);
  card.classList.remove('streaming');
  lampState(hatKey, 'done');
  return out;
}

/* ---------- 12. 蓝帽·收束：合成最终结论 ---------- */
async function blueHatSynthesize(topic, essence, allOutputs, runToken) {
  lampState('blue-close', 'active');
  document.getElementById('pipeStatus').textContent = '蓝帽正在收束全场、合成最终结论…';

  const card = createHatCard('blue', { id: 'blue-close', synthesis: true,
    title: '蓝帽 · 审议结论', role: '综合全场，给出决策建议' });
  setCardBody(card, '<p style="color:var(--text-sub)">综合中…</p>', true);

  const context = Object.keys(allOutputs).map(function (k) {
    return '【' + HATS[k].name + '】\n' + allOutputs[k];
  }).join('\n\n');

  const sys = '你是六顶思考帽方法中的【蓝帽】，负责收束整场审议。\n' +
    '你不是在重复各顶帽子的发言，而是做综合、找矛盾、给判断。\n\n' +
    '必须严格按以下 Markdown 结构输出，标题原样保留：\n' +
    '## 议题本质\n（一到两句话点破）\n' +
    '## 事实底座\n（白帽确证的关键事实，未知项单独标出）\n' +
    '## 价值与机会\n（黄帽里最值得抓住的）\n' +
    '## 风险与红线\n（黑帽里最致命的，按严重度排序）\n' +
    '## 创意与替代方案\n（绿帽里最有价值的几条）\n' +
    '## 直觉信号\n（红帽透露的集体情绪，一句话）\n' +
    '## 决策建议\n（明确给出：建议推进 / 建议暂缓 / 建议改方案，并说明关键前提条件与下一步动作）\n\n' +
    '要求：观点要收敛，不要和稀泥；有矛盾之处要明确指出；总长不超过 700 字。';

  const user = '【待审议议题】\n' + topic + '\n\n' +
    (essence ? '【蓝帽开局判定的议题本质】\n' + essence + '\n\n' : '') +
    '【各顶帽子产出】\n' + context;

  let acc = '';
  const out = await callAI(sys, user, 'blue-close', function (t) {
    acc = t; setCardBody(card, renderMD(t), true);
  }, runToken);

  setCardBody(card, renderMD(out), false);
  lampState('blue-close', 'done');
  return out;
}

/* ---------- 13. 主流程编排 ---------- */
let RUN_TOKEN = 0;
let LAST_RECORD = null;

async function runCouncil() {
  const topic = document.getElementById('topicInput').value.trim();
  if (!topic) { toast('请先输入待审议的议题'); return; }

  RUN_TOKEN++;
  const myToken = RUN_TOKEN;

  // UI 复位
  document.getElementById('results').innerHTML = '';
  document.getElementById('inquirySection').style.display = 'none';  // 新一轮推演前收起追问室
  document.getElementById('runBtn').disabled = true;
  document.getElementById('runBtnText').innerHTML = '<span class="spinner"></span> 推演中…';
  document.getElementById('cancelBtn').style.display = 'inline-flex';
  document.getElementById('pipeline').classList.add('show');
  buildLamps(DEFAULT_ORDER);
  Object.keys(HATS).forEach(function (k) { lampState(k, null); });
  lampState('blue-close', null);
  startTimer();

  const record = { topic: topic, time: new Date().toISOString(), essence: '', outputs: {}, synthesis: '', inquiries: [] };

  try {
    /* ① 蓝帽开局 */
    lampState('blue-open', 'active');
    document.getElementById('pipeStatus').textContent = '蓝帽正在编排审议流程…';
    const planRes = await blueHatPlan(topic, myToken);
    lampState('blue-open', 'done');
    record.essence = planRes.essence;

    // 依据蓝帽规划重建灯阵
    const order = planRes.plan.map(function (p) { return p.hat; });
    buildLamps(order);
    lampState('blue-open', 'done');

    /* ② 逐顶帽子串行推进（关键：串行，规避并发上限） */
    let contextText = '';
    for (let i = 0; i < planRes.plan.length; i++) {
      if (myToken !== RUN_TOKEN) throw new Error('CANCELLED');
      const p = planRes.plan[i];
      const out = await runOneHat(p.hat, p.focus, topic, contextText, myToken);
      record.outputs[p.hat] = out;
      contextText += '\n【' + HATS[p.hat].name + '】\n' + out + '\n';
    }

    /* ③ 蓝帽收束合成 */
    if (myToken !== RUN_TOKEN) throw new Error('CANCELLED');
    const synthesis = await blueHatSynthesize(topic, planRes.essence, record.outputs, myToken);
    record.synthesis = synthesis;

    /* ④ 留档 + 导出按钮 */
    await saveRecord(record);
    LAST_RECORD = record;
    appendExportButtons(record);
    showInquiryRoom();   // 推演完成，开放追问研讨室

    document.getElementById('pipeStatus').textContent = '✅ 六帽推演完成';
    stopTimer();
    if (isCherry && window.cherry.notification) {
      try { await window.cherry.notification.show({ title: '六帽推演完成', body: topic.slice(0, 40) }); } catch (e) {}
    }

  } catch (err) {
    stopTimer();
    if (err.message === 'CANCELLED') {
      document.getElementById('pipeStatus').textContent = '⏹ 推演已终止';
      toast('推演已终止');
    } else if (err.message === 'NO_MODEL') {
      document.getElementById('pipeStatus').textContent = '⚠️ 未检测到可用模型';
      toast('Cherry 中尚未配置默认模型，请先在设置里配置', 4200);
    } else {
      document.getElementById('pipeStatus').textContent = '⚠️ ' + err.message;
      toast('推演中断：' + err.message, 4000);
    }
  } finally {
    document.getElementById('runBtn').disabled = false;
    document.getElementById('runBtnText').textContent = '重新推演';
    document.getElementById('cancelBtn').style.display = 'none';
  }
}

/* ---------- 14. 留档与导出 ---------- */
async function saveRecord(rec) {
  try {
    if (!rec || !rec.topic) return;
    let list = (await store.get('history')) || [];
    // 同一场推演就地更新（追问记录随之落盘），避免产生重复档案
    var idx = -1;
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i].topic === rec.topic && list[i].time === rec.time) { idx = i; break; }
    }
    if (idx >= 0) list[idx] = rec;
    else list.unshift(rec);
    if (list.length > 30) list = list.slice(0, 30);
    await store.set('history', list);
    renderHistory(list);
  } catch (e) { console.warn('留档失败', e); }
}

function buildMarkdown(rec) {
  let md = '# 六帽推演报告\n\n**议题：** ' + rec.topic + '\n\n**时间：** ' + rec.time + '\n\n';
  if (rec.essence) md += '**议题本质：** ' + rec.essence + '\n\n';
  md += '---\n\n';
  const order = ['white', 'green', 'yellow', 'black', 'red'];
  order.forEach(function (k) {
    if (rec.outputs[k]) md += '## ' + HATS[k].icon + ' ' + HATS[k].name + ' · ' + HATS[k].role + '\n\n' + rec.outputs[k] + '\n\n';
  });
  if (rec.synthesis) md += '---\n\n# ' + HATS.blue.icon + ' 蓝帽审议结论\n\n' + rec.synthesis + '\n';
  return md;
}

function appendExportButtons(rec) {
  const wrap = document.getElementById('results');
  const bar = document.createElement('div');
  bar.className = 'btn-row';
  bar.style.marginTop = '8px';
  bar.innerHTML =
    '<button class="btn-ghost btn-sm" id="expMd">📄 导出 Markdown</button>' +
    '<button class="btn-ghost btn-sm" id="expCopy">📋 复制全文</button>' +
    '<button class="btn-ghost btn-sm" id="expJson">🧩 导出 JSON</button>';
  wrap.appendChild(bar);

  bar.querySelector('#expMd').onclick = async function () {
    const md = buildMarkdown(rec);
    if (isCherry && window.cherry.clipboard) { try { await window.cherry.clipboard.writeText(md); } catch (e) {} }
    const a = document.createElement('a');
    a.href = 'data:text/markdown;charset=utf-8,' + encodeURIComponent(md);
    a.download = '六帽推演_' + rec.topic.slice(0, 16).replace(/[\\/:*?"<>|]/g, '') + '.md';
    a.click();
    toast('Markdown 已导出');
  };
  bar.querySelector('#expCopy').onclick = async function () {
    const md = buildMarkdown(rec);
    try {
      if (isCherry && window.cherry.clipboard) await window.cherry.clipboard.writeText(md);
      else await navigator.clipboard.writeText(md);
      toast('已复制到剪贴板');
    } catch (e) { toast('复制失败，请手动选择文本'); }
  };
  bar.querySelector('#expJson').onclick = function () {
    const blob = new Blob([JSON.stringify(rec, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '六帽推演.json';
    a.click();
    toast('JSON 已导出');
  };
}

function renderHistory(list) {
  const sec = document.getElementById('historySection');
  const box = document.getElementById('historyList');
  if (!list || !list.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  box.innerHTML = '';
  list.forEach(function (r, i) {
    const el = document.createElement('div');
    el.className = 'history-item';
    el.innerHTML = '<span class="history-topic">' + esc(r.topic) + '</span>' +
                   '<span class="history-time">' + (r.time || '').slice(0, 16).replace('T', ' ') + '</span>';
    el.onclick = function () { loadRecord(r); };
    box.appendChild(el);
  });
}

function loadRecord(rec) {
  document.getElementById('results').innerHTML = '';
  document.getElementById('pipeline').classList.remove('show');
  document.getElementById('topicInput').value = rec.topic;

  if (rec.essence) {
    const c = createHatCard('blue', { id: 'h-open', title: '蓝帽 · 议题本质', role: '来自历史档案' });
    setCardBody(c, '<p>' + esc(rec.essence) + '</p>', false);
  }
  const order = ['white', 'green', 'yellow', 'black', 'red'];
  order.forEach(function (k) {
    if (!rec.outputs || !rec.outputs[k]) return;
    const c = createHatCard(k, {});
    setCardBody(c, renderMD(rec.outputs[k]), false);
  });
  if (rec.synthesis) {
    const c = createHatCard('blue', { id: 'h-close', synthesis: true, title: '蓝帽 · 审议结论', role: '综合全场' });
    setCardBody(c, renderMD(rec.synthesis), false);
  }
  appendExportButtons(rec);

  // 载入历史档案后，追问研讨室切换为该场推演的上下文
  LAST_RECORD = rec;
  showInquiryRoom();

  window.scrollTo({ top: document.getElementById('results').offsetTop - 90, behavior: 'smooth' });
  toast('已载入历史档案');
}

/* =====================================================================
   14b. 穿透追问 · 深度研讨室
   将「议题 + 六顶帽子全部产出 + 蓝帽收束结论」整体注入上下文，支持持续追问
   ===================================================================== */
var inquiryBusy = false;

function buildInquirySystem(rec) {
  if (!rec || !rec.topic) {
    return '你是资深决策顾问，请用 Markdown 给出结构化、具体、可执行的回答。';
  }
  var p = [];
  p.push('你是「六帽推演厅」的【蓝帽主持人】，刚刚主持完下面这场六顶思考帽审议。');
  p.push('');
  p.push('==================== 本场推演全景 ====================');
  p.push('【待审议议题】');
  p.push(String(rec.topic).trim());

  if (rec.essence) {
    p.push('');
    p.push('【议题本质（蓝帽开局判定）】');
    p.push(String(rec.essence).trim());
  }

  p.push('');
  ['white', 'green', 'yellow', 'black', 'red'].forEach(function (k) {
    var t = rec.outputs && rec.outputs[k];
    if (!t) return;
    p.push('──── ' + HATS[k].icon + ' ' + HATS[k].name + '（' + HATS[k].role + '）────');
    p.push(String(t).trim());
    p.push('');
  });

  if (rec.synthesis) {
    p.push('──── 🧭 蓝帽审议结论（综合全场）────');
    p.push(String(rec.synthesis).trim());
    p.push('');
  }

  p.push('====================================================');
  p.push('');
  p.push('现在，用户将围绕上述议题与本场推演结论，向你展开持续的定向追问与深度研讨。');
  p.push('');
  p.push('【回复准则】');
  p.push('1. 严格立足本场推演作答；援引某顶帽子时请点名（如「黑帽指出…」），不要泛泛而谈。');
  p.push('2. 敢于给出明确判断与取舍，不要和稀泥、不要只罗列而不下结论。');
  p.push('3. 使用 Markdown 排版（标题、列表，必要时用表格做方案对比），便于快速吸收。');
  p.push('4. 直击要害，避免复述推演中已经讲过的内容。');
  return p.join('\n');
}

function renderInquiryRoom() {
  var box = document.getElementById('inquiryChat');
  if (!box) return;
  var rec = LAST_RECORD;
  var items = (rec && Array.isArray(rec.inquiries)) ? rec.inquiries : [];

  if (!items.length) {
    box.innerHTML = '<div class="inquiry-empty">💬 尚无追问记录。点击上方快捷问题，或在下方输入框中围绕本次六帽推演继续深度追问。</div>';
    return;
  }

  box.innerHTML = items.map(function (m) {
    var isUser = m.role === 'user';
    var who = isUser ? '👤 我的追问' : '🎩 六帽议事厅 · 蓝帽主持';
    return '<div class="inquiry-msg ' + (isUser ? 'user' : 'assistant') + '">' +
             '<div class="inquiry-bubble" style="--hat-color:#818cf8">' +
               '<div class="inquiry-who">' + who + '</div>' +
               '<div class="hat-card-body">' + renderMD(m.content) + '</div>' +
             '</div>' +
           '</div>';
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function showInquiryRoom() {
  var sec = document.getElementById('inquirySection');
  if (sec) sec.style.display = 'block';
  renderInquiryRoom();
}

async function sendInquiry(text) {
  var q = (text || '').trim();
  if (!q) return;

  var rec = LAST_RECORD;
  if (!rec || !rec.topic) { toast('请先完成一次六帽推演，再展开追问研讨'); return; }
  if (inquiryBusy) return;

  if (!Array.isArray(rec.inquiries)) rec.inquiries = [];
  rec.inquiries.push({ role: 'user', content: q, time: Date.now() });
  var assistantMsg = { role: 'assistant', content: '', time: Date.now() };
  rec.inquiries.push(assistantMsg);

  var inputEl = document.getElementById('inquiryInput');
  if (inputEl) inputEl.value = '';
  renderInquiryRoom();

  var box = document.getElementById('inquiryChat');
  var lastEl = box ? box.lastElementChild : null;
  var bodyEl = lastEl ? lastEl.querySelector('.hat-card-body') : null;
  if (bodyEl) bodyEl.innerHTML = '<span class="inquiry-typing"><i></i><i></i><i></i></span>';

  var btn = document.getElementById('inquirySend');
  if (btn) btn.disabled = true;
  inquiryBusy = true;

  // 组装多轮上下文：system(推演全景) + 最近 10 条有效历史
  var messages = [{ role: 'system', content: buildInquirySystem(rec) }];
  rec.inquiries.slice(0, -1).slice(-10).forEach(function (m) {
    var c = (m && m.content) ? String(m.content).trim() : '';
    if (!c) return;                        // 跳过空消息，避免部分模型接口报 400
    messages.push({ role: m.role === 'user' ? 'user' : 'assistant', content: c });
  });

  try {
    var full = await callAIMessages(messages, function (acc) {
      assistantMsg.content = acc;
      if (bodyEl) bodyEl.innerHTML = renderMD(acc);
      if (box) box.scrollTop = box.scrollHeight;
    });
    if (!full) {
      assistantMsg.content = '（本次未收到模型返回内容，请确认 Cherry Studio 已配置好默认模型后重试）';
      if (bodyEl) bodyEl.innerHTML = renderMD(assistantMsg.content);
    }
  } catch (err) {
    assistantMsg.content = '⚠️ 追问研讨遇到异常：' + ((err && err.message) ? err.message : String(err));
    if (bodyEl) bodyEl.innerHTML = renderMD(assistantMsg.content);
  } finally {
    inquiryBusy = false;
    if (btn) btn.disabled = false;
    renderInquiryRoom();
    try { await saveRecord(rec); } catch (e) { console.warn(e); }
  }
}

function initInquiryRoom() {
  var sendBtn = document.getElementById('inquirySend');
  if (sendBtn) {
    sendBtn.onclick = function () {
      var el = document.getElementById('inquiryInput');
      if (el) sendInquiry(el.value);
    };
  }

  var input = document.getElementById('inquiryInput');
  if (input) {
    input.onkeydown = function (e) {
      // isComposing：中文输入法拼音候选阶段按回车是「选字」，不能当作发送
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendInquiry(e.target.value);
      }
    };
  }

  var clearBtn = document.getElementById('inquiryClear');
  if (clearBtn) {
    clearBtn.onclick = async function () {
      var rec = LAST_RECORD;
      if (!rec || !Array.isArray(rec.inquiries) || !rec.inquiries.length) return;
      rec.inquiries = [];
      renderInquiryRoom();
      try { await saveRecord(rec); } catch (e) { console.warn(e); }
    };
  }

  var chips = document.getElementById('inquiryChips');
  if (chips) {
    Array.prototype.forEach.call(chips.querySelectorAll('.inquiry-chip'), function (chip) {
      chip.onclick = function () {
        var q = chip.getAttribute('data-q');
        if (!q) return;
        var el = document.getElementById('inquiryInput');
        if (el) el.value = q;
        sendInquiry(q);
      };
    });
  }
}

  { t: '个人重大选择', v: '我是否应该接受这个跨城市的工作机会？' },
  { t: '政策落地', v: '公司是否应该推行全员远程办公制度？' }
];

function init() {
  const badge = document.getElementById('envBadge');
  if (isCherry) {
    badge.textContent = '已连接 Cherry 宿主';
    badge.style.color = 'var(--success)';
    badge.style.borderColor = 'rgba(16,185,129,0.4)';

      window.cherry.app.getInfo().then(function (info) {
        badge.textContent = 'Cherry v' + (info.hostVersion || '?');
      }).catch(function () {});
    }
  } else {
    badge.textContent = '离线仿真轨 · 需 Cherry 运行';
    badge.style.color = 'var(--warning)';
    badge.style.borderColor = 'rgba(245,158,11,0.4)';
  }

  const chips = document.getElementById('templateChips');
  TEMPLATES.forEach(function (tp) {
    const el = document.createElement('span');
    el.className = 'chip';
    el.textContent = tp.t;
    el.onclick = function () { document.getElementById('topicInput').value = tp.v; };
    chips.appendChild(el);
  });

  document.getElementById('runBtn').onclick = runCouncil;
  initInquiryRoom();
  document.getElementById('cancelBtn').onclick = function () {
    RUN_TOKEN++;
    if (isCherry && window.cherry.ai && window.cherry.ai.cancel) {
      ['blue-plan', 'white', 'green', 'yellow', 'black', 'red', 'blue-close']
        .forEach(function (id) { try { window.cherry.ai.cancel('hat-' + id); } catch (e) {} });
    }
  };

  document.getElementById('results').innerHTML =
    '<div class="empty"><div class="empty-icon">🎩</div>' +
    '输入一个议题，六顶帽子会依次登台，从事实、创意、价值、风险、直觉五个角度把它看透，<br>最后由蓝帽收束成一份可执行的决策建议。</div>';

  store.get('history').then(function (list) { if (list) renderHistory(list); });
}

init();
